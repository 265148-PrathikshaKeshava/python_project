{% extends 'finance/base.html' %}
{% block content %}
<h2>Recurring Deposit (RD) Calculator</h2>

<form method="post" class="row g-3">
    {% csrf_token %}
    <div class="col-md-4">
        <label class="form-label">Monthly Investment (₹)</label>
        <input type="number" step="0.01" name="monthly_investment" class="form-control" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Annual Interest Rate (%)</label>
        <input type="number" step="0.01" name="rate" class="form-control" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Tenure (Years)</label>
        <input type="number" name="years" class="form-control" required>
    </div>

    <div class="col-12 mt-3">
        <button type="submit" class="btn btn-primary">Calculate</button>
    </div>
</form>

{% if result %}
<div class="alert alert-info mt-4">
    <strong>Maturity Value:</strong> ₹{{ result }}
</div>
{% endif %}
{% endblock %}
