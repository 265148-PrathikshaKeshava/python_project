{% extends 'finance/base.html' %}
{% block content %}
<h2>Fixed Deposit (FD) Calculator</h2>
<form method="post" class="row g-3">
    {% csrf_token %}
    <div class="col-md-4">
        <label class="form-label">Deposit Amount (₹)</label>
        <input type="number" step="0.01" name="principal" class="form-control" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Annual Interest Rate (%)</label>
        <input type="number" step="0.01" name="rate" class="form-control" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Tenure (Years)</label>
        <input type="number" name="years" class="form-control" required>
    </div>
    <div class="col-12 mt-3">
        <button type="submit" class="btn btn-success">Calculate</button>
    </div>
</form>
{% if result %}
<div class="alert alert-success mt-4">Maturity Amount: ₹{{ result }}</div>
{% endif %}
{% endblock %}
