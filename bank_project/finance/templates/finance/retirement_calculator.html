{% extends 'finance/base.html' %}
{% block content %}
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background-color: #f5f7fa;
    }

    .calculator-card {
        background-color: #fff;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        padding: 30px;
        max-width: 900px;
        margin: auto;
        margin-top: 40px;
    }

    label {
        font-weight: 500;
        color: #333;
    }

    input.form-control {
        background-color: #f0f2f5;
        border-radius: 8px;
        border: 1px solid #ccc;
    }

    .btn-gradient {
        background: linear-gradient(to right, #28a745, #1e7e34);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px;
        font-weight: 600;
        transition: background 0.3s ease;
    }

    .btn-gradient:hover {
        background: linear-gradient(to right, #1e7e34, #145c2d);
    }

    h2 {
        font-weight: 600;
        color: #1e7e34;
        text-align: center;
        margin-bottom: 25px;
    }

    .alert-info {
        background-color: #e8f4f8;
        color: #155a7a;
        border-radius: 8px;
        border: 1px solid #c5e4f1;
    }
</style>

<div class="calculator-card">
    <h2>Retirement Savings Estimator</h2>

    <form method="post" class="row g-4">
        {% csrf_token %}
        <div class="col-md-3">
            <label class="form-label">Current Savings (₹)</label>
            <input type="number" step="0.01" name="current_savings" class="form-control" required>
        </div>

        <div class="col-md-3">
            <label class="form-label">Monthly Contribution (₹)</label>
            <input type="number" step="0.01" name="monthly_contribution" class="form-control" required>
        </div>

        <div class="col-md-3">
            <label class="form-label">Annual Interest Rate (%)</label>
            <input type="number" step="0.01" name="annual_rate" class="form-control" required>
        </div>

        <div class="col-md-3">
            <label class="form-label">Years Until Retirement</label>
            <input type="number" name="years_until_retirement" class="form-control" required>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-gradient w-100">Estimate Retirement Corpus</button>
        </div>
    </form>

    {% if result %}
    <div class="alert alert-info mt-4 text-center">
        <strong>Projected Retirement Corpus:</strong> ₹{{ result }}
    </div>
    {% endif %}
</div>
{% endblock %}
