{% extends 'finance/base.html' %}
{% block content %}
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background-color: #f5f7fa;
    }

    .calculator-card {
        background-color: #fff;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        padding: 30px;
        max-width: 900px;
        margin: auto;
        margin-top: 40px;
    }

    label {
        font-weight: 500;
        color: #333;
    }

    input.form-control {
        background-color: #f0f2f5;
        border-radius: 8px;
        border: 1px solid #ccc;
    }

    .btn-gradient {
        background: linear-gradient(to right, #343a40, #23272b);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px;
        font-weight: 600;
        transition: background 0.3s ease;
    }

    .btn-gradient:hover {
        background: linear-gradient(to right, #23272b, #1a1d21);
    }

    h2 {
        font-weight: 600;
        color: #343a40;
        text-align: center;
        margin-bottom: 25px;
    }

    .alert-success {
        background-color: #eaf8e7;
        color: #3c763d;
        border-radius: 8px;
        border: 1px solid #d6e9c6;
        text-align: center;
    }
</style>

<div class="calculator-card">
    <h2>Net Worth Calculator</h2>

    <form method="post" class="row g-4">
        {% csrf_token %}
        <div class="col-md-6">
            <label class="form-label">Total Assets (₹)</label>
            <input type="number" name="assets" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Total Liabilities (₹)</label>
            <input type="number" name="liabilities" class="form-control" required>
        </div>
        <div class="col-12 mt-3">
            <button type="submit" class="btn btn-gradient w-100">Calculate Net Worth</button>
        </div>
    </form>

    {% if result %}
    <div class="alert alert-success mt-4">
        <strong>Net Worth:</strong> ₹{{ result }}
    </div>
    {% endif %}
</div>
{% endblock %}
