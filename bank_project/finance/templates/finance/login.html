<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UST Global Bank - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #004080, #0074d9);
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #004080;
        }

        .form-label {
            font-weight: 500;
        }

        .btn-primary {
            background-color: #004080;
            border: none;
        }

        .btn-primary:hover {
            background-color: #003366;
        }

        .bank-logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .bank-logo img {
            max-width: 150px;
        }

        .footer-link {
            font-size: 0.9rem;
            text-align: center;
            margin-top: 20px;
        }

        .spinner-border {
            display: none;
        }

        .alert {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    
<div class="login-card">
    <div class="bank-logo text-center mb-4">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135706.png" alt="Bank Logo" style="max-width: 100px;">
    </div>

    <form id="loginForm" method="POST" novalidate>
        {% csrf_token %}
        <h2>UST Global Bank</h2>

        <div class="mb-3">
            <label for="username" class="form-label">Username or Customer ID</label>
            <input type="text" class="form-control" id="username" name="username" required>
            <div class="invalid-feedback">Please enter your username.</div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
            <div class="invalid-feedback">Please enter your password.</div>
        </div>

        {% if error %}
            <div class="alert alert-danger text-center">{{ error }}</div>
        {% endif %}

        <div class="d-grid">
            <button type="submit" class="btn btn-primary">
                Login
                <span class="spinner-border spinner-border-sm ms-2" role="status" aria-hidden="true"></span>
            </button>
        </div>

        <div class="footer-link">
            <p>Don't have an account? <a href="{% url 'signup' %}">Register Now</a></p>
            <p><a href="#">Forgot Password?</a></p>
        </div>
    </form>
</div>

<script>
    const form = document.getElementById('loginForm');
    const spinner = document.querySelector('.spinner-border');

    form.addEventListener('submit', function (e) {
        let valid = true;

        const username = document.getElementById('username');
        const password = document.getElementById('password');

        if (!username.value.trim()) {
            username.classList.add('is-invalid');
            valid = false;
        } else {
            username.classList.remove('is-invalid');
        }

        if (!password.value.trim()) {
            password.classList.add('is-invalid');
            valid = false;
        } else {
            password.classList.remove('is-invalid');
        }

        if (!valid) {
            e.preventDefault();
            return;
        }

        spinner.style.display = 'inline-block';
    });
</script>

</body>
</html>
