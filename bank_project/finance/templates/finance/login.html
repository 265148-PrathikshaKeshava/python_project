<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Finance Tools</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background-color: #f0f2f5;
        }
        form {
            background: white;
            padding: 20px;
            max-width: 400px;
            border-radius: 8px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 8px;
            margin: 10px 0 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        .error {
            color: red;
            margin-top: 10px;
        }

        form div {
            text-align: center;
        }
        form p {
            font-size: 14px;
            margin-top: 10px;
        }

    </style>
</head>
<body>

    <form method="POST">
        {% csrf_token %}
        <h2>Login</h2>
    
        <label>Username:</label>
        <input type="text" name="username" required>
    
        <label>Password:</label>
        <input type="password" name="password" required>
    
        <div style="text-align: center;">
            <button type="submit">Login</button>
    
            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}
    
            <p style="margin-top: 20px;">
                Don't have an account? <a href="{% url 'signup' %}">Sign up here</a>.
            </p>
        </div>
    </form>
    

</body>
</html>
