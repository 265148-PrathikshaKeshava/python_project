{% extends 'finance/base.html' %}
{% block content %}
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background-color: #f5f7fa;
    }

    .calculator-card {
        background-color: #fff;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        padding: 30px;
        max-width: 800px;
        margin: auto;
        margin-top: 40px;
    }

    label {
        font-weight: 500;
        color: #333;
    }

    input.form-control {
        background-color: #f0f2f5;
        border-radius: 8px;
        border: 1px solid #ccc;
    }

    .btn-gradient {
        background: linear-gradient(to right, #007bff, #0056b3);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px;
        font-weight: 600;
        transition: background 0.3s ease;
    }

    .btn-gradient:hover {
        background: linear-gradient(to right, #0056b3, #003d80);
    }

    h2 {
        font-weight: 600;
        color: #0056b3;
        text-align: center;
        margin-bottom: 25px;
    }

    .alert-info {
        background-color: #e6f0ff;
        color: #004085;
        border-radius: 8px;
        border: 1px solid #b3d7ff;
        text-align: center;
    }
</style>

<div class="calculator-card">
    <h2>Taxable Income Calculator</h2>

    <form method="post" class="row g-4">
        {% csrf_token %}
        <div class="col-md-6">
            <label class="form-label">Gross Income (₹)</label>
            <input type="number" name="gross_income" class="form-control" required>
        </div>

        <div class="col-md-6">
            <label class="form-label">Deductions (₹)</label>
            <input type="number" name="deductions" class="form-control" required>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-gradient w-100">Calculate</button>
        </div>
    </form>

    {% if result %}
    <div class="alert alert-info mt-4">
        <strong>Taxable Income:</strong> ₹{{ result }}
    </div>
    {% endif %}
</div>
{% endblock %}
