{% extends 'finance/base.html' %}
{% block content %}
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background-color: #f5f7fa;
    }

    .calculator-card {
        background-color: #fff;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        padding: 30px;
        max-width: 900px;
        margin: auto;
        margin-top: 40px;
    }

    label {
        font-weight: 500;
        color: #333;
    }

    input.form-control {
        background-color: #f0f2f5;
        border-radius: 8px;
        border: 1px solid #ccc;
    }

    .btn-gradient {
        background: linear-gradient(to right, #28a745, #218838);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px;
        font-weight: 600;
        transition: background 0.3s ease;
    }

    .btn-gradient:hover {
        background: linear-gradient(to right, #218838, #1c7430);
    }

    h2 {
        font-weight: 600;
        color: #218838;
        text-align: center;
        margin-bottom: 25px;
    }

    .alert-info {
        background-color: #d1ecf1;
        color: #0c5460;
        border-radius: 8px;
        border: 1px solid #bee5eb;
        text-align: center;
    }

    .alert-info p {
        margin: 5px 0;
    }
</style>

<div class="calculator-card">
    <h2>Simple Budget Planner</h2>

    <form method="post" class="row g-4">
        {% csrf_token %}
        <div class="col-md-4">
            <label class="form-label">Monthly Income (₹)</label>
            <input type="number" name="income" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Fixed Expenses (₹)</label>
            <input type="number" name="fixed_expenses" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Variable Expenses (₹)</label>
            <input type="number" name="variable_expenses" class="form-control" required>
        </div>
        <div class="col-12 mt-3">
            <button type="submit" class="btn btn-gradient w-100">Analyze Budget</button>
        </div>
    </form>

    {% if result %}
    <div class="alert alert-info mt-4">
        <p><strong>Total Expenses:</strong> ₹{{ result.Total_Expenses }}</p>
        <p><strong>Savings:</strong> ₹{{ result.Savings }}</p>
        <p><strong>Suggestion:</strong> {{ result.Suggestion }}</p>
    </div>
    {% endif %}
</div>
{% endblock %}
