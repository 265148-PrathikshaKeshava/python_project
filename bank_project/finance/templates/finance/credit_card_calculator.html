{% extends 'finance/base.html' %}
{% block content %}
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background-color: #f5f7fa;
    }

    .calculator-card {
        background-color: #fff;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        padding: 30px;
        max-width: 900px;
        margin: auto;
        margin-top: 40px;
    }

    label {
        font-weight: 500;
        color: #333;
    }

    input.form-control {
        background-color: #f0f2f5;
        border-radius: 8px;
        border: 1px solid #ccc;
    }

    .btn-gradient {
        background: linear-gradient(to right, #dc3545, #a71d2a);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px;
        font-weight: 600;
        transition: background 0.3s ease;
    }

    .btn-gradient:hover {
        background: linear-gradient(to right, #a71d2a, #7a1620);
    }

    h2 {
        font-weight: 600;
        color: #a71d2a;
        text-align: center;
        margin-bottom: 25px;
    }

    .alert-warning {
        background-color: #fff4e5;
        color: #7a4f01;
        border-radius: 8px;
        border: 1px solid #ffd8a8;
        text-align: center;
    }
</style>

<div class="calculator-card">
    <h2>Credit Card Interest Calculator</h2>
    <form method="post" class="row g-4">
        {% csrf_token %}
        <div class="col-md-3">
            <label class="form-label">Current Balance (₹)</label>
            <input type="number" name="balance" class="form-control" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">Annual Interest Rate (%)</label>
            <input type="number" name="annual_rate" class="form-control" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">Months</label>
            <input type="number" name="months" class="form-control" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">Minimum Payment Rate (default 5%)</label>
            <input type="number" name="min_payment_rate" class="form-control" placeholder="Optional">
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-gradient w-100">Calculate Balance</button>
        </div>
    </form>

    {% if result %}
    <div class="alert alert-warning mt-4">
        <strong>Estimated Balance After Interest:</strong> ₹{{ result }}
    </div>
    {% endif %}
</div>
{% endblock %}
